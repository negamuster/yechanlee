name: Manual rules briefing fallback
on:
  workflow_dispatch:
permissions:
  contents: write
  statuses: read
concurrency:
  group: daily-digest
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BRIEFING_REPORT_PATH: /tmp/briefing-execution.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - run: node --test tests/briefing-*.test.mjs
      - name: Publish new date after validation
        env:
          BRIEFING_AI: rules
        run: |
          node scripts/generate-daily-digest.mjs --scheduled
          npm run build
          git add content/briefings src/data/published-briefings.json src/data/latest-briefing.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Publish daily news digest'
          # No force/rebase: fail safely on a competing update; rerun against latest main.
          git push origin HEAD:main
      - name: Check Vercel deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          for attempt in $(seq 1 24); do
            state=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/status" --jq '[.statuses[] | select(.context == "Vercel")][0].state // "pending"')
            if [ "$state" = success ]; then echo "Vercel deployment succeeded"; exit 0; fi
            if [ "$state" = failure ] || [ "$state" = error ]; then echo "Vercel deployment failed"; exit 1; fi
            sleep 15
          done
          echo 'Deployment not confirmed; check Vercel. No automatic rollback.'
          exit 1
      - name: Record execution diagnostics
        if: always()
        run: |
          node --input-type=module - <<'JS'
          import {existsSync,readFileSync,appendFileSync} from 'node:fs'
          const path=process.env.BRIEFING_REPORT_PATH
          const report=existsSync(path)?readFileSync(path,'utf8'):'No generation report: existing edition preserved, or failure before optional AI stage.'
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,'## Briefing execution\n\n```json\n'+report+'\n```\n')
          JS
