name: Daily briefing with optional Gemini
on:
  schedule:
    - cron: '53 21 * * *' # Prepare at 06:53 KST; collection waits until 07:00
    - cron: '17,37 22 * * *' # Recovery: 07:17 / 07:37 KST; existing edition is preserved
  workflow_dispatch:
  workflow_run:
    workflows: [Check production data health]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-digest.yml'
      - 'scripts/*digest*'
      - 'scripts/briefing-*.mjs'
      - 'tests/briefing-*.test.mjs'
permissions:
  contents: write
  statuses: read
concurrency:
  group: daily-digest
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BRIEFING_REPORT_PATH: /tmp/briefing-execution.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - run: node --test tests/briefing-*.test.mjs
      - name: Hold early preparation until 07:00 KST
        if: github.event_name == 'schedule'
        run: |
          node --input-type=module - <<'JS'
          const now=Date.now(), target=new Date(now)
          target.setUTCHours(22,0,0,0)
          const delay=target.getTime()-now
          if(delay>0 && delay<=7*60000)await new Promise(resolve=>setTimeout(resolve,delay))
          JS
      - name: Live collection check on code changes
        if: github.event_name == 'push'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BRIEFING_AI: research
          DIGEST_PREVIEW_PATH: /tmp/briefing-preview.json
        run: |
          node scripts/generate-daily-digest.mjs --dry-run --require-research
          node -e "const p=JSON.parse(require('fs').readFileSync('/tmp/briefing-preview.json')); console.log(JSON.stringify({mode:p.review.mode,summary:p.summary,blocks:p.blocks,sources:p.sources},null,2))"
      - name: Publish new date after validation
        if: github.event_name != 'push'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BRIEFING_AI: research
        run: |
          node scripts/generate-daily-digest.mjs --scheduled
          npm run build
          git add content/briefings src/data/published-briefings.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Publish daily news digest'
          # No force/rebase: fail safely on a competing update; rerun against latest main.
          git push origin HEAD:main
      - name: Build code changes
        if: github.event_name == 'push'
        run: npm run build
      - name: Check Vercel deployment
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          for attempt in $(seq 1 24); do
            state=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/status" --jq '[.statuses[] | select(.context == "Vercel")][0].state // "pending"')
            if [ "$state" = success ]; then echo "Vercel deployment succeeded"; exit 0; fi
            if [ "$state" = failure ] || [ "$state" = error ]; then echo "Vercel deployment failed"; exit 1; fi
            sleep 15
          done
          echo 'Deployment not confirmed; check Vercel. No automatic rollback.'
          exit 1
      - name: Record execution diagnostics
        if: always()
        run: |
          node --input-type=module - <<'JS'
          import {existsSync,readFileSync,appendFileSync} from 'node:fs'
          const path=process.env.BRIEFING_REPORT_PATH
          const report=existsSync(path)?readFileSync(path,'utf8'):'No generation report: existing edition preserved, or failure before optional AI stage.'
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,'## Briefing execution\n\n```json\n'+report+'\n```\n')
          JS
