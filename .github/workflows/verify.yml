name: Verify site changes
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'public/anthracite-social*'
      - 'config/sec-monitor.json'
      - 'config/us-equity-calendar-review.json'
      - 'data/us-equity-sessions.json'
      - 'requirements-calendar.txt'
      - 'public/data/sec-filings.json'
      - 'requirements-edgar.txt'
      - '.github/workflows/refresh-sec-filings.yml'
      - 'src/**'
      - 'lib/**'
      - 'api/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package*.json'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - 'playwright.config.mjs'
      - 'eslint.config.js'
      - '.github/workflows/verify.yml'
      - '.github/workflows/check-data-health.yml'
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Record checked revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
        id: dependencies
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements-edgar.txt -r requirements-calendar.txt
      - run: python -m unittest discover -s tests -p 'test_sec_monitor.py'
      - run: python -m unittest discover -s tests -p 'test_exchange_calendar.py'
      - run: python scripts/build-exchange-calendar.py --check
      - run: node scripts/validate-sec-filings.mjs
      - run: npm test
        id: node_tests
      - run: npm run lint
        id: lint
      - run: npm run build
        id: build
      - run: npm run setup:browsers
        id: browser_install
      - run: npm run test:e2e
        id: browser_tests
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: home-ui-review
          include-hidden-files: true
          path: |
            test-results/**/home-ui*.png
            test-results/**/home-ui*.json
            test-results/**/screen-review*.png
            test-results/**/screen-review*.json
            dist/.vite/initial-loading.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Summarize revision and checks
        if: always()
        env:
          CHECKED_SHA: ${{ steps.revision.outputs.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DEPENDENCIES: ${{ steps.dependencies.outcome }}
          NODE_TESTS: ${{ steps.node_tests.outcome }}
          LINT: ${{ steps.lint.outcome }}
          BUILD: ${{ steps.build.outcome }}
          BROWSER_INSTALL: ${{ steps.browser_install.outcome }}
          BROWSER_TESTS: ${{ steps.browser_tests.outcome }}
        run: |
          {
            printf '## Verification evidence\n\n'
            printf '| Revision | SHA |\n| --- | --- |\n'
            printf '| Checked checkout (PR: integrated merge) | %s |\n' "${CHECKED_SHA:-unavailable}"
            printf '| PR head | %s |\n' "${PR_HEAD_SHA:-not a PR run}"
            printf '| PR base | %s |\n\n' "${PR_BASE_SHA:-not a PR run}"
            printf '| Check | Outcome |\n| --- | --- |\n'
            printf '| Dependencies | %s |\n' "$DEPENDENCIES"
            printf '| Node regression tests | %s |\n' "$NODE_TESTS"
            printf '| ESLint (zero warnings) | %s |\n' "$LINT"
            printf '| Production build | %s |\n' "$BUILD"
            printf '| Chromium installation | %s |\n' "$BROWSER_INSTALL"
            printf '| Desktop/mobile Chromium tests | %s |\n\n' "$BROWSER_TESTS"
            printf 'This run does not verify a Vercel preview, production deployment, physical mobile device, or Safari.\n'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-test-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
