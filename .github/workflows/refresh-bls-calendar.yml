name: Refresh official BLS calendar
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-bls-calendar.yml'
      - 'scripts/refresh-bls-calendar.mjs'
      - 'lib/calendar.js'
      - 'lib/fred-calendar.js'
permissions:
  contents: write
concurrency:
  group: refresh-bls-calendar
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node --test tests/calendar.test.mjs tests/fred-calendar.test.mjs
      - run: node scripts/refresh-bls-calendar.mjs
      - name: Save verified schedule
        run: |
          git add data/bls-calendar.json data/fred-bls-calendar.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh verified BLS calendar sources'
          git pull --rebase origin main
          git push origin HEAD:main
