name: Check production data health
on:
  schedule:
    - cron: '47 */6 * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ['Verify site changes']
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: production-data-health
  cancel-in-progress: ${{ github.event_name == 'workflow_run' }}
jobs:
  check:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - run: node --test tests/data-health.test.mjs tests/stock-health.test.mjs tests/stock-contracts.test.mjs tests/deployment-health.test.mjs
      - name: Skip superseded revisions
        id: revision
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          current=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$current" = "$EXPECTED_SHA" ]; then
            echo 'eligible=true' >> "$GITHUB_OUTPUT"
          else
            echo '::notice::A newer main revision exists; skipping this production check.'
          fi
      - name: Wait for the expected production build
        if: steps.revision.outputs.eligible == 'true'
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: node scripts/wait-for-production.mjs "$EXPECTED_SHA"
      - if: steps.revision.outputs.eligible == 'true'
        run: node scripts/check-data-health.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: production-data-health
          path: reports/data-health.json
          retention-days: 7
          if-no-files-found: ignore
