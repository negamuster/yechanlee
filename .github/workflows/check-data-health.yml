name: Check production data health
on:
  schedule:
    - cron: '47 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-data-health.yml'
      - 'scripts/check-data-health.mjs'
      - 'lib/data-health.js'
permissions:
  contents: read
concurrency:
  group: production-data-health
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node tests/data-health.test.mjs
      - run: node scripts/check-data-health.mjs
